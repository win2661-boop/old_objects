<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>우리 주변의 오래된 물건 탐험대</title>
    <style>
        body { font-family: 'Nanum Gothic', sans-serif; background: #fdf5e6; color: #5d4037; text-align: center; padding: 20px; }
        .museum-header { border-bottom: 3px double #8d6e63; margin-bottom: 20px; }
        .button-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 20px; }
        button { padding: 15px; cursor: pointer; background: #d7ccc8; border: 2px solid #8d6e63; border-radius: 10px; font-weight: bold; }
        button:hover { background: #efebe9; }
        #content-area, #quiz-area { display: none; background: #fff; padding: 20px; border-radius: 15px; border: 2px dashed #8d6e63; max-width: 600px; margin: auto; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="main-view">
    <h1 class="museum-header">🕰️ 우리 주변의 오래된 물건 전시회</h1>
    <p>궁금한 물건을 클릭해서 옛날 사람들의 생활을 알아볼까요?</p>
    <div class="button-grid" id="item-buttons"></div>
    <br>
    <button onclick="showQuiz()" style="background:#a5d6a7;">📝 물건 이름 맞히기 퀴즈!</button>
</div>

<div id="content-area">
    <h2 id="obj-name"></h2>
    <div id="obj-info" style="text-align: left;"></div>
    <br>
    <button onclick="goBack()">🔙 처음으로 돌아가기</button>
</div>

<div id="quiz-area">
    <h2>퀴즈: 물건 사진(이름)을 보고 이름을 맞춰보세요!</h2>
    <p>(수업 진행 시 학생들과 함께 사진을 매칭해보세요.)</p>
    <button onclick="goBack()">🔙 처음으로 돌아가기</button>
</div>

<script>
const data = {
    "맷돌": { "시기": "아주 옛날부터", "방법": "두 돌판 사이에 곡물을 넣고 손잡이를 돌려 갈아요.", "이유": "곡식을 가루로 만들어 요리하기 위해", "상황": "어머니가 아침에 콩을 갈아 두부를 만들어요.", "현대물건": "믹서기", "불편함": "힘이 많이 들고 시간이 오래 걸려요.", "기분": "가족을 위해 정성껏 음식을 준비하는 뿌듯함" },
    "카세트 테이프": { "시기": "1980~90년대", "방법": "기기에 테이프를 넣고 재생 버튼을 눌러요.", "이유": "음악을 듣거나 녹음하기 위해", "상황": "좋아하는 노래를 들으려고 연필로 테이프를 감아요.", "현대물건": "스마트폰 음악 앱", "불편함": "원하는 노래를 찾으려면 한참 감아야 해요.", "기분": "좋아하는 가수의 노래를 들을 생각에 설레요." },
    "다이얼 전화기": { "시기": "1970~80년대", "방법": "숫자 구멍에 손가락을 넣어 끝까지 돌려요.", "이유": "멀리 있는 사람과 대화하기 위해", "상황": "친구 집에 전화하려고 구멍에 손가락을 넣어요.", "현대물건": "스마트폰", "불편함": "번호를 하나씩 돌려야 해서 오래 걸려요.", "기분": "멀리 있는 친구의 목소리를 듣게 되어 기뻐요." },
    // 나머지 항목도 동일 형식으로 추가 가능
};

const items = ["맷돌", "카세트 테이프", "머리 인두", "타자기", "풍금", "재봉틀", "빨래판과 빨래 방망이", "다듬잇돌과 방망이", "컴퓨터와 플로피디스크", "다이얼 전화기", "연탄과 연탄집게", "공중 전화기"];

const container = document.getElementById('item-buttons');
items.forEach(item => {
    let btn = document.createElement('button');
    btn.innerText = item;
    btn.onclick = () => showInfo(item);
    container.appendChild(btn);
});

function showInfo(name) {
    document.getElementById('main-view').style.display = 'none';
    document.getElementById('content-area').style.display = 'block';
    document.getElementById('obj-name').innerText = name;
    const info = data[name] || { "설명": "준비 중입니다!" };
    let html = "";
    for(let key in info) html += `<p><b>${key}:</b> ${info[key]}</p>`;
    document.getElementById('obj-info').innerHTML = html;
}

function showQuiz() {
    document.getElementById('main-view').style.display = 'none';
    document.getElementById('quiz-area').style.display = 'block';
}

function goBack() {
    document.getElementById('main-view').style.display = 'block';
    document.getElementById('content-area').style.display = 'none';
    document.getElementById('quiz-area').style.display = 'none';
}
</script>
</body>
</html>
