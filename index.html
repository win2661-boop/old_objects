<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>우리 주변의 오래된 물건 탐험대</title>
    <style>
        body { font-family: 'Nanum Gothic', sans-serif; background: #fdf5e6; color: #5d4037; text-align: center; padding: 20px; }
        .museum-header { border-bottom: 3px double #8d6e63; margin-bottom: 20px; }
        
        /* e뮤지엄 버튼 스타일 */
        .top-link { margin: 20px 0; padding: 12px 25px; background: #5d4037; color: white; border-radius: 20px; text-decoration: none; display: inline-block; font-weight: bold; }
        
        /* 물건 버튼 그리드 스타일 */
        .button-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; padding: 20px; max-width: 800px; margin: auto; }
        .item-btn { padding: 20px; cursor: pointer; background: #d7ccc8; border: 2px solid #8d6e63; border-radius: 10px; font-weight: bold; transition: 0.3s; }
        .item-btn:hover { background: #bcaaa4; color: white; }
        
        /* 콘텐츠 영역 */
        #content-area, #quiz-area { display: none; background: #fff; padding: 30px; border-radius: 15px; border: 2px dashed #8d6e63; max-width: 600px; margin: auto; text-align: left; }
        .back-btn { margin-top: 20px; padding: 10px; width: 100%; cursor: pointer; background: #a5d6a7; border: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div id="main-view">
    <h1 class="museum-header">🕰️ 우리 주변의 오래된 물건 전시회</h1>
    
    <a href="https://www.emuseum.go.kr" target="_blank" class="top-link">🔍 물건 정보 찾기 (e뮤지엄 바로가기)</a>
    
    <p>아래 물건 중 궁금한 것을 클릭해 보세요!</p>
    
    <div class="button-grid" id="item-buttons"></div>
    
    <br>
    <button onclick="showQuiz()" style="padding: 15px 30px; background: #ffcc80; border: none; border-radius: 10px; cursor: pointer; font-weight: bold;">📝 정리 퀴즈 풀기!</button>
</div>

<div id="content-area">
    <h2 id="obj-name" style="text-align: center; color: #8d6e63;"></h2>
    <div id="obj-info"></div>
    <button class="back-btn" onclick="goBack()">🔙 앞으로 가기 (초기 화면)</button>
</div>

<div id="quiz-area">

    <div id="quiz-content"></div>
    <button class="back-btn" onclick="goBack()">🔙 앞으로 가기 (초기 화면)</button>
