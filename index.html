<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>과거 탐험단의 옛날 물건 전시회</title>
    <style>
        :root {
            --bg-color: #f2efe9;
            --main-brown: #5c4d3d;
            --white: #ffffff;
            --shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--main-brown); margin: 0; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* A 화면 */
        #screenA { text-align: center; margin-top: 100px; }
        #screenA h1 { font-size: 3.5rem; margin-bottom: 10px; }
        #screenA p { font-size: 1.5rem; color: #887a6a; margin-bottom: 50px; }
        .btn-main { padding: 20px 40px; font-size: 1.2rem; background: var(--main-brown); color: white; border: none; border-radius: 50px; cursor: pointer; margin: 0 10px; }

        /* B 화면 (조사하기) */
        .input-box { margin-bottom: 25px; text-align: left; }
        .input-box label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 1.1rem; }
        input[type="text"], input[type="file"], textarea { 
            width: 100%; padding: 15px; border: 2px solid var(--main-brown); border-radius: 10px; box-sizing: border-box; font-size: 1rem; 
        }
        textarea { height: 120px; resize: vertical; } /* 최소 3줄 이상 공간 */

        /* C 화면 (전시관) */
        .gallery-container { display: flex; flex-direction: column; align-items: center; gap: 50px; margin-top: 40px; }
        .card-wrapper { width: 80%; aspect-ratio: 16/9; perspective: 1000px; cursor: pointer; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s; transform-style: preserve-3d; }
        .card-wrapper.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; background: white; padding: 20px; box-shadow: var(--shadow); border-radius: 15px; }
        .card-front img { width: 100%; height: 85%; object-fit: cover; border-radius: 10px; }
        .card-back { transform: rotateY(180deg); overflow-y: auto; }
        
        .screen { display: none; }
        .active { display: block; }
    </style>
</head>
<body>

<div class="container">
    <div id="screenA" class="screen active">
        <h1>과거 탐험단의 옛날 물건 전시회</h1>
        <p>오래된 물건으로 옛날 사람들의 생활 모습 알아보기</p>
        <button class="btn-main" onclick="showScreen('screenB')">1. 조사하기</button>
        <button class="btn-main" onclick="loadExhibition()">2. 전시하기</button>
    </div>

    <div id="screenB" class="screen">
        <h2 style="text-align: center;">물건 조사하기</h2>
        <div class="input-box"><label>1. 이름</label><input type="text" id="userName"></div>
        <div class="input-box"><label>2. 물건 사진</label><input type="file" id="itemImg" accept="image/*"></div>
        <div class="input-box"><label>3. 물건 이름</label><input type="text" id="itemName"></div>
        <div class="input-box"><label>4. 소개하기</label><textarea id="itemIntro"></textarea></div>
        <div class="input-box"><label>5. 왜? 어떻게 사용했을까?</label><textarea id="itemUse"></textarea></div>
        <div class="input-box"><label>6. 요즘에는? 왜 사라졌을까?</label><textarea id="itemReason"></textarea></div>
        <button class="btn-main" style="width: 100%;" onclick="saveData()">저장하기</button>
        <button onclick="showScreen('screenA')">돌아가기</button>
    </div>

    <div id="screenC" class="screen">
        <button onclick="showScreen('screenA')">← 전시회 홈으로</button>
        <div id="gallery" class="gallery-container"></div>
    </div>
</div>

<script>
    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function saveData() {
        const file = document.getElementById('itemImg').files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = { userName: document.getElementById('userName').value, itemName: document.getElementById('itemName').value, itemIntro: document.getElementById('itemIntro').value, itemUse: document.getElementById('itemUse').value, itemReason: document.getElementById('itemReason').value, imgBase64: e.target.result };
            let list = JSON.parse(localStorage.getItem('exhibits') || '[]');
            list.push(data);
            localStorage.setItem('exhibits', JSON.stringify(list));
            alert('저장 완료!');
            showScreen('screenA');
        };
        reader.readAsDataURL(file);
    }
    function loadExhibition() {
        const gallery = document.getElementById('gallery'); gallery.innerHTML = '';
        JSON.parse(localStorage.getItem('exhibits') || '[]').forEach(item => {
            gallery.innerHTML += `
                <div class="card-wrapper" onclick="this.classList.toggle('flipped')">
                    <div class="card-inner">
                        <div class="card-front"><img src="${item.imgBase64}"><h2 style="text-align:center">${item.itemName}</h2></div>
                        <div class="card-back"><h3>${item.itemName}</h3><p><b>작성자:</b> ${item.userName}</p><p><b>소개:</b> ${item.itemIntro}</p><p><b>사용법:</b> ${item.itemUse}</p><p><b>변화:</b> ${item.itemReason}</p></div>
                    </div>
                </div>`;
        });
        showScreen('screenC');
    }
</script>
</body>
</html>
